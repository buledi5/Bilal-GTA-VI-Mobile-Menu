
name: Build Bilal GTA VI AML Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Download GTA SA PSDK
        uses: actions/checkout@v4
        with:
          repository: AndroidModLoader/aml-psdk
          path: aml-psdk

      - name: Download AML core headers
        uses: actions/checkout@v4
        with:
          repository: RusJJ/AndroidModLoader
          path: aml-core

      - name: Find AML headers
        run: |
          HEADER=$(find aml-core -type f -path '*/mod/amlmod.h' -print -quit)

          if [ -z "$HEADER" ]; then
            echo "ERROR: AML core header not found"
            find aml-core -name amlmod.h
            exit 1
          fi

          INCLUDE_DIR=$(dirname "$(dirname "$HEADER")")
          echo "AML_INCLUDE_DIR=$GITHUB_WORKSPACE/$INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "Found header: $HEADER"

      - name: Configure ARM64
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DAML_INCLUDE_DIR="$AML_INCLUDE_DIR"

      - name: Compile plugin
        run: cmake --build build --config Release

      - name: Collect plugin
        run: |
          mkdir -p output
          find build -name 'libBilalGTAVI.so' -exec cp {} output/ \;
          test -f output/libBilalGTAVI.so

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: Bilal-GTA-VI-ARM64
          path: output/
          
